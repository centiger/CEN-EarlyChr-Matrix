<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>초대교회 Matrix</title>
<meta name="theme-color" content="#D65A1F" />
<meta name="description" content="CEN Bible 초대교회 Matrix - 복음 확장의 시대" />
<link rel="manifest" href="manifest.json" />
<style>
:root{--bg:#fff7ed;--ink:#2b1d14;--muted:#7d6658;--main:#f97316;--deep:#c2410c;--soft:#ffedd5;--line:#fed7aa;--card:#fff;--gold:#f6c65b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#fff2df 0,#fff8f1 45%,#fff7ed 100%);color:var(--ink)}
.app{min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 18px 8px;text-align:center}.badge{display:inline-flex;gap:6px;align-items:center;background:var(--soft);color:var(--deep);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}.top h1{margin:10px 0 4px;font-size:27px;letter-spacing:-.04em}.top p{margin:0;color:var(--muted);font-size:14px}.timeline{margin:12px auto 4px;max-width:720px;padding:11px 14px 10px;border-radius:18px;background:#fff;border:1px solid #ffe0bd;box-shadow:0 8px 22px rgba(194,65,12,.08)}.years,.timeline-icons,.events{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;gap:4px}.years{font-size:13px;color:#b45309;font-weight:900}.timeline-icons{font-size:18px;margin-top:4px;line-height:1}.events{font-size:11px;color:#7d6658;margin-top:4px;font-weight:800}
.matrix-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 14px 18px}.matrix{position:relative;width:min(96vw,760px);height:min(72vh,620px);min-height:520px;border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,247,237,.95));border:1px solid #fed7aa;box-shadow:0 22px 55px rgba(154,52,18,.14);overflow:hidden}.matrix:before{content:"";position:absolute;inset:9%;border:1px dashed rgba(249,115,22,.3);border-radius:50%}.center{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:220px;min-height:220px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff3e6 72%,#ffe3c0 100%);border:2px solid #fdba74;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;box-shadow:0 18px 35px rgba(194,65,12,.14);z-index:2}.center .era{font-size:24px;font-weight:900;letter-spacing:-.05em}.center .sub{margin-top:3px;color:var(--deep);font-weight:900}.center .msg{margin-top:10px;font-size:12.5px;line-height:1.45;color:#4a2a18}.center .verse{margin-top:7px;font-size:11.5px;line-height:1.45;color:#704323}.hub{position:absolute;width:138px;min-height:124px;border:none;border-radius:24px;background:#fff;color:var(--ink);box-shadow:0 12px 28px rgba(154,52,18,.13);border:1px solid #fed7aa;padding:12px 9px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:.18s transform,.18s box-shadow}.hub:active{transform:scale(.97)}.hub .icon{font-size:31px}.hub .name{font-weight:900;font-size:16px;margin-top:4px}.hub .desc{font-size:13px;color:#6b5140;margin-top:4px;line-height:1.05;font-weight:700;letter-spacing:-.35px;white-space:nowrap}.hub .chip{margin-top:8px;background:var(--soft);color:var(--deep);font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px}.h-persecution{left:50%;top:6%;transform:translateX(-50%)}.h-pentecost{left:4%;top:30%}.h-revelation{right:4%;top:30%}.h-expansion{left:15%;bottom:15%}.h-mission{right:15%;bottom:15%}.actions{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;display:flex;gap:8px}.btn{border:none;border-radius:999px;background:var(--deep);color:#fff;font-weight:900;padding:11px 16px;box-shadow:0 8px 20px rgba(194,65,12,.22);cursor:pointer}.btn.secondary{background:#fff;color:var(--deep);border:1px solid #fdba74}.modal-back{display:none;position:fixed;inset:0;background:rgba(35,20,10,.38);z-index:20;align-items:center;justify-content:center;padding:18px}.modal{width:min(94vw,480px);background:#fff;border-radius:26px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal h2{margin:0 0 12px;font-size:22px}.hub-list{display:grid;gap:10px}.hub-link{border:1px solid #fed7aa;background:#fffaf4;border-radius:18px;padding:13px 14px;text-align:left;font-weight:900;color:var(--ink);text-decoration:none}.hub-link small{display:block;color:var(--muted);font-weight:600;margin-top:3px}.close{margin-top:14px;width:100%}
@media(max-width:520px){.top h1{font-size:23px}.matrix{height:650px;min-height:650px;border-radius:24px}.matrix:before{inset:11%}.center{top:48.5%;width:168px;min-height:168px;padding:13px}.center .era{font-size:20px}.center .sub{font-size:13px}.center .msg{font-size:10.8px;line-height:1.38;margin-top:7px}.center .verse{font-size:10px;line-height:1.36;margin-top:6px}.hub{width:104px;min-height:108px;border-radius:18px;padding:9px 5px}.hub .icon{font-size:25px}.hub .name{font-size:13.5px}.hub .desc{font-size:11px;line-height:1.03;font-weight:700;letter-spacing:-.45px;white-space:nowrap}.hub .chip{font-size:9px;padding:3px 6px}.h-pentecost{left:1%;top:31%}.h-revelation{right:1%;top:31%}.h-expansion{left:12%;bottom:17%}.h-mission{right:12%;bottom:17%}.h-persecution{top:7%}.actions{bottom:14px}.years{font-size:10.5px}.timeline-icons{font-size:15px}.events{font-size:9.5px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><span class="badge">🔥 CEN Bible 시대별총람</span><h1>초대교회 Matrix</h1><p>AD 33 ~ AD 95 · 복음 확장의 시대</p><div class="timeline"><div class="years"><span>AD 33</span><span>AD 34</span><span>AD 36</span><span>AD 46~67</span><span>AD 95</span></div><div class="timeline-icons"><span>🔥</span><span>🌎</span><span>⚔️</span><span>✉️</span><span>👑</span></div><div class="events"><span>오순절</span><span>확장</span><span>박해</span><span>선교·서신</span><span>계시</span></div></div></header>
<main class="matrix-wrap"><section class="matrix" aria-label="초대교회 매트릭스">
<button class="hub h-persecution" onclick="location.href='hubs/index.html?hub=persecution'"><span class="icon">⚔️</span><span class="name">박해 허브</span><span class="desc">박해 속 성장</span><span class="chip">허브탐험</span></button>
<button class="hub h-pentecost" onclick="location.href='hubs/index.html?hub=pentecost'"><span class="icon">🔥</span><span class="name">오순절 허브</span><span class="desc">교회의 탄생</span><span class="chip">허브탐험</span></button>
<button class="hub h-revelation" onclick="location.href='hubs/index.html?hub=revelation'"><span class="icon">👑</span><span class="name">계시 허브</span><span class="desc">새 하늘과 새 땅</span><span class="chip">준비중</span></button>
<button class="hub h-expansion" onclick="location.href='hubs/index.html?hub=expansion'"><span class="icon">🌎</span><span class="name">복음확장</span><span class="desc">예루살렘에서 땅끝까지</span><span class="chip">허브탐험</span></button>
<button class="hub h-mission" onclick="location.href='hubs/index.html?hub=mission'"><span class="icon">✉️</span><span class="name">선교·서신</span><span class="desc">교회의 확립</span><span class="chip">허브탐험</span></button>
<div class="center"><div class="era">초대교회</div><div class="sub">복음 확장의 시대</div><div class="msg">성령이 임하시고<br>복음이 땅끝까지 전파되다</div><div class="verse">“오직 성령이<br>너희에게 임하시면<br>너희가 권능을 받고”<br><b>(행 1:8)</b></div></div>
<div class="actions"><button class="btn" onclick="openHubList()">허브 목록</button><button class="btn secondary" onclick="location.href='hubs/index.html?hub=pentecost'">오순절 시작</button></div>
</section></main></div>
<div class="modal-back" id="hubModal"><div class="modal"><h2>초대교회 허브 목록</h2><div class="hub-list" id="hubList"></div><button class="btn close" onclick="closeHubList()">닫기</button></div></div>
<script>
const HUBS=[
 {id:'pentecost',icon:'🔥',title:'오순절 허브',sub:'승천 · 오순절 · 성령강림 · 베드로 설교 · 3000명 회심',ready:true},
 {id:'expansion',icon:'🌎',title:'복음확장 허브',sub:'성전 미문 · 사마리아 · 에티오피아 내시 · 고넬료 · 안디옥 교회',ready:true},
 {id:'persecution',icon:'⚔️',title:'박해 허브',sub:'스데반 순교 · 교회 박해 · 사울 · 다메섹 · 바울 회심',ready:true},
 {id:'mission',icon:'✉️',title:'선교·서신 허브',sub:'1차 선교 · 예루살렘 공의회 · 2차 선교 · 3차 선교 · 옥중서신',ready:true},
 {id:'revelation',icon:'👑',title:'계시 허브',sub:'밧모섬 · 일곱 교회 · 하늘 보좌 · 새 예루살렘 · 재림',ready:false}
];
function openHubList(){const box=document.getElementById('hubList');box.innerHTML=HUBS.map(h=>`<a class="hub-link" href="hubs/index.html?hub=${h.id}">${h.icon} ${h.title}${h.ready?'':' <small>제작 예정</small>'}<small>${h.sub}</small></a>`).join('');document.getElementById('hubModal').style.display='flex'}
function closeHubList(){document.getElementById('hubModal').style.display='none'}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
