<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>초대교회 Matrix 허브</title>
<meta name="theme-color" content="#D65A1F" />
<style>
:root{--main:#f97316;--deep:#c2410c;--soft:#ffedd5;--line:#fed7aa;--ink:#2b1d14;--muted:#7d6658;--bg:#fff7ed;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff7ed,#fffaf5);color:var(--ink)}.app{max-width:920px;margin:0 auto;padding:16px}.top{position:sticky;top:0;background:rgba(255,247,237,.94);backdrop-filter:blur(10px);z-index:5;padding:12px 0;border-bottom:1px solid #ffe6c9}.nav{display:flex;gap:8px;align-items:center;justify-content:space-between}.btn{border:none;border-radius:999px;background:var(--deep);color:white;font-weight:900;padding:10px 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 7px 18px rgba(194,65,12,.18)}.btn.light{background:#fff;color:var(--deep);border:1px solid #fdba74;box-shadow:none}.hero{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 16px 36px rgba(154,52,18,.1)}.hero h1{margin:0;font-size:30px;letter-spacing:-.05em}.period{margin-top:5px;color:var(--muted);font-weight:700}.message{margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:14px;font-weight:900;color:#7c2d12;line-height:1.5}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #ffe0bd;border-radius:24px;padding:18px;box-shadow:0 10px 26px rgba(154,52,18,.08)}.card h2{margin:0 0 12px;font-size:20px}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}.num{width:34px;height:34px;border-radius:50%;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}.step b{display:block}.step span{display:block;color:var(--muted);font-size:13px;margin-top:2px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:999px;padding:7px 10px;font-weight:800;font-size:13px}.mapbox img{width:100%;border-radius:20px;border:1px solid #f0c9a0;background:#fff7ed}.map-caption{margin-top:10px;font-size:13px;line-height:1.55;color:#5f4636}.bottom-nav{display:flex;gap:10px;justify-content:space-between;margin:18px 0 30px}.modal-back{display:none;position:fixed;inset:0;background:rgba(35,20,10,.4);z-index:20;align-items:center;justify-content:center;padding:18px}.modal{width:min(94vw,480px);background:#fff;border-radius:26px;padding:20px}.modal h2{margin:0 0 12px}.hub-list{display:grid;gap:10px}.hub-link{border:1px solid #fed7aa;background:#fffaf4;border-radius:18px;padding:13px 14px;text-align:left;font-weight:900;color:var(--ink);text-decoration:none}.hub-link small{display:block;color:var(--muted);font-weight:600;margin-top:3px}.close{margin-top:14px;width:100%}@media(max-width:700px){.app{padding:12px}.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.bottom-nav{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="nav"><a class="btn light" href="../index.html">← Matrix</a><button class="btn" onclick="openHubList()">허브 목록</button></div></header>
<main id="root"></main>
</div>
<div class="modal-back" id="hubModal"><div class="modal"><h2>초대교회 허브 목록</h2><div class="hub-list" id="hubList"></div><button class="btn close" onclick="closeHubList()">닫기</button></div></div>
<script>
const hubs=[
 {id:'pentecost',icon:'🔥',title:'오순절 허브',theme:'교회의 탄생',ready:true,period:'AD 33',message:'성령이 임하시고 복음 공동체가 시작되다',verse:'오직 성령이 너희에게 임하시면 너희가 권능을 받고 (행 1:8)',map:'assets/maps/pentecost-hub-map.png',mapText:'감람산에서 예수께서 승천하시며 제자들에게 성령을 약속하는 장면으로 시작한다. 이어 예루살렘 다락방에서 제자들이 기도하는 가운데 오순절 성령강림이 일어나고 불의 혀 같은 것이 각 사람 위에 임하는 모습을 표현한다. 성전 주변에서는 베드로가 담대히 설교하고 수많은 사람들이 회개하는 장면을 배치한다. 이어 3000명이 세례를 받고 초대교회 공동체가 형성되는 모습을 통해 교회의 탄생이 한눈에 보이도록 구성한다. 감람산, 다락방, 예루살렘 성전, 세례 장면, 초대교회 공동체를 주요 시각 요소로 표현하고 이동 흐름이 자연스럽게 이어지도록 한다.',people:['예수','베드로','열두 사도','마리아와 제자들','예루살렘 순례자들'],steps:[['승천','예수께서 감람산에서 성령의 약속과 사명을 주심'],['다락방 기도','제자들이 예루살렘에 머물며 약속을 기다림'],['오순절 성령강림','불의 혀처럼 성령이 각 사람 위에 임함'],['베드로 설교','예수의 죽음과 부활을 담대히 증언함'],['3000명 회심','세례와 말씀과 교제를 통해 교회 공동체가 탄생함']],connections:['예수시대 부활 허브 → 승천과 지상명령','시내산 언약 → 오순절 새 언약 공동체','성막의 임재 → 성령의 임재','베드로의 회복 → 베드로의 설교','예루살렘 → 땅끝 선교의 출발점'],prev:null,next:'expansion'},
 {id:'expansion',icon:'🌎',title:'복음확장 허브',theme:'예루살렘에서 땅끝까지',ready:true,period:'AD 33~45',message:'복음은 유대인을 넘어 사마리아와 이방 세계로 확장되다',verse:'예루살렘과 온 유대와 사마리아와 땅 끝까지 (행 1:8)',map:'assets/maps/expansion-hub-map.png',mapText:'예루살렘 성전 미문에서 베드로와 요한이 앉은뱅이를 고치며 복음을 증거하는 장면으로 시작한다. 이어 빌립이 사마리아에서 복음을 전하고 성령이 임하는 장면, 가사 광야 길에서 에티오피아 내시가 이사야서를 읽다가 복음을 듣고 세례받는 장면을 배치한다. 가이사랴에서는 베드로의 환상과 고넬료 집의 이방인 성령강림을 표현하고, 마지막에는 안디옥 교회가 세워져 세계선교의 중심지가 되는 흐름이 보이도록 구성한다. 예루살렘, 사마리아, 가사 광야, 가이사랴, 안디옥을 주요 지점으로 표시하고 행 1:8의 확장 흐름이 자연스럽게 이어지도록 한다.',people:['베드로','요한','빌립','에티오피아 내시','고넬료','바나바'],steps:[['성전 미문','베드로와 요한이 앉은뱅이를 고치고 복음을 증거함'],['사마리아 복음화','빌립의 전도로 복음이 유대 경계를 넘어 사마리아로 확장됨'],['에티오피아 내시','광야 길에서 이사야서를 통해 복음을 듣고 세례를 받음'],['고넬료 사건','베드로의 환상과 이방인 성령강림으로 이방 구원이 공식적으로 열림'],['안디옥 교회','그리스도인이라 불리고 세계선교의 중심 교회로 세워짐']],connections:['오순절 → 복음확장','바벨탑 → 오순절','아브라함 → 열방축복','이사야 → 열방선교','요나 → 고넬료'],prev:'pentecost',next:'persecution'},
 {id:'persecution',icon:'⚔️',title:'박해 허브',theme:'박해 속 성장',ready:true,period:'AD 34~36',message:'사람은 교회를 흩었지만 하나님은 복음을 확장하셨다',verse:'그 흩어진 사람들이 두루 다니며 복음의 말씀을 전할새 (행 8:4)',map:'assets/maps/persecution-hub-map.png',mapText:'예루살렘에서 스데반이 공회 앞에서 복음을 증언하다 돌에 맞아 순교하는 장면으로 시작한다. 이어 사울이 교회를 박해하고 성도들이 흩어지는 장면을 배치한다. 다메섹으로 가는 길에서는 강한 빛과 음성 가운데 사울이 부활하신 예수를 만나고, 아나니아를 통해 눈을 뜨고 세례받는 장면을 표현한다. 마지막에는 회심한 바울이 복음을 전하고 바나바와 함께 안디옥 사역으로 연결되며 선교시대가 열리는 흐름이 보이도록 구성한다. 예루살렘, 다메섹, 안디옥을 주요 지점으로 표시하고 박해가 오히려 복음 확장의 통로가 되는 과정을 시각화한다.',people:['스데반','사울/바울','아나니아','바나바','예루살렘 교회'],steps:[['스데반 순교','공회 앞에서 복음을 증언한 뒤 첫 순교자가 됨'],['교회 박해','사울의 박해로 성도들이 흩어지고 복음이 퍼져 나감'],['다메섹 도상','사울이 빛과 음성 가운데 부활하신 예수를 만남'],['바울 회심','아나니아를 통해 눈을 뜨고 세례를 받으며 복음의 사도로 부름받음'],['안디옥 합류','바나바와 함께 안디옥에서 사역하며 선교시대가 준비됨']],connections:['요셉 → 악을 선으로 바꾸심','출애굽 박해 → 이스라엘 성장','다니엘 박해 → 신앙 승리','십자가 → 부활','스데반 → 바울'],prev:'expansion',next:'mission'},
 {id:'mission',icon:'✉️',title:'선교·서신 허브',theme:'교회의 확립',ready:true,period:'AD 46~67',message:'복음은 도시를 변화시키고 교회는 말씀으로 세워지다',verse:'내가 선한 싸움을 싸우고 달려갈 길을 마치고 믿음을 지켰으니 (딤후 4:7)',map:'assets/maps/mission-hub-map.png',mapText:'안디옥 교회에서 바울과 바나바가 성령의 인도하심으로 파송되는 장면으로 시작한다. 이어 구브로와 갈라디아 지역으로 이어지는 1차 선교여행, 예루살렘 공의회에서 이방인 선교의 기준이 정리되는 장면을 배치한다. 이후 마게도냐 환상을 따라 빌립보와 데살로니가, 고린도로 복음이 확장되는 2차 선교여행, 에베소를 중심으로 교회가 강화되는 3차 선교여행을 표현한다. 마지막에는 로마 감금 중에도 바울이 옥중서신을 기록하며 여러 교회를 말씀으로 세우는 흐름이 보이도록 구성한다. 안디옥, 구브로, 갈라디아, 예루살렘, 빌립보, 고린도, 에베소, 로마를 주요 지점으로 표시하고 선교여행과 서신 사역이 자연스럽게 이어지도록 한다.',people:['바울','바나바','실라','디모데','누가','예루살렘 사도들'],steps:[['1차 선교여행','안디옥에서 파송되어 구브로와 갈라디아 지역에 복음을 전함'],['예루살렘 공의회','할례 논쟁을 넘어 은혜의 복음과 이방인 선교의 기준을 확립함'],['2차 선교여행','마게도냐 환상을 따라 빌립보·데살로니가·고린도로 복음이 확장됨'],['3차 선교여행','에베소를 중심으로 소아시아 교회를 강화하고 말씀 사역을 확장함'],['옥중서신','로마 감금 중에도 에베소서·빌립보서·골로새서·빌레몬서를 통해 교회를 세움']],connections:['아브라함 → 열방 축복','요나 → 이방 선교','다니엘 → 열방 증언','안디옥 교회 → 세계 선교','서신 → 교회 성장'],prev:'persecution',next:'revelation'},
 {id:'revelation',icon:'👑',title:'계시 허브',theme:'새 하늘과 새 땅',ready:false,period:'AD 95',message:'교회는 고난 속에서도 재림과 새 창조를 바라보다',verse:'보라 내가 만물을 새롭게 하노라 (계 21:5)',map:'assets/maps/revelation-hub-map.png',mapText:'밧모섬, 일곱 교회, 하늘 보좌, 새 예루살렘, 재림 소망의 흐름.',people:['요한','일곱 교회','어린양'],steps:[['밧모섬','요한이 계시를 받음'],['일곱 교회','교회에 주어진 권면'],['하늘 보좌','어린양의 통치'],['새 예루살렘','새 하늘과 새 땅'],['재림','역사의 완성']],connections:['초대교회 → 재림 소망','창조 → 새 창조'],prev:'mission',next:null}
];
const params=new URLSearchParams(location.search);const id=params.get('hub')||'pentecost';const hub=hubs.find(h=>h.id===id)||hubs[0];
function render(){const root=document.getElementById('root'); if(!hub.ready){root.innerHTML=`<section class="hero"><h1>${hub.icon} ${hub.title}</h1><div class="period">${hub.period} · ${hub.theme}</div><div class="message">이 허브는 제작 예정입니다.</div><div style="margin-top:16px"><button class="btn" onclick="openHubList()">다른 허브 보기</button></div></section>`;return;} const prev=hubs.find(h=>h.id===hub.prev), next=hubs.find(h=>h.id===hub.next); root.innerHTML=`<section class="hero"><h1>${hub.icon} ${hub.title}</h1><div class="period">${hub.period} · ${hub.theme}</div><div class="message">${hub.message}<br><small>${hub.verse}</small></div></section><section class="grid"><div class="card"><h2>핵심사건 흐름</h2><div class="steps">${hub.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}</div></div><div class="card"><h2>대표인물</h2><div class="tags">${hub.people.map(p=>`<span class="tag">${p}</span>`).join('')}</div><h2 style="margin-top:18px">연결탐험</h2><div class="tags">${hub.connections.map(c=>`<span class="tag">${c}</span>`).join('')}</div></div></section><section class="card mapbox" style="margin-top:14px"><h2>허브 지도</h2><img src="${hub.map}" alt="${hub.title} 지도"><div class="map-caption">${hub.mapText}</div></section><nav class="bottom-nav">${prev?`<a class="btn light" href="?hub=${prev.id}">← 이전 허브: ${prev.title}</a>`:'<a class="btn light" href="../index.html">← Matrix로 돌아가기</a>'}${next?`<a class="btn" href="?hub=${next.id}">다음 허브: ${next.title} →</a>`:'<a class="btn" href="../index.html">Matrix로 돌아가기</a>'}</nav>`}
function openHubList(){const box=document.getElementById('hubList');box.innerHTML=hubs.map(h=>`<a class="hub-link" href="?hub=${h.id}">${h.icon} ${h.title}${h.ready?'':' <small>제작 예정</small>'}<small>${h.theme}</small></a>`).join('');document.getElementById('hubModal').style.display='flex'}
function closeHubList(){document.getElementById('hubModal').style.display='none'}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
